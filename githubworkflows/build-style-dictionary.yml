name: Build Style Dictionary, Compile SCSS, and Deploy to GitHub Pages

on:
  push:
    paths:
      - 'MyProject/tokens/global.json' # يشتغل لما يحصل تغيير في global.json
      - 'MyProject/scss/style.scss' # يشتغل لما يحصل تغيير في style.scss

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout للـ Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # تثبيت Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # تثبيت الـ Dependencies (style-dictionary و sass)
      - name: Install Dependencies
        run: npm install style-dictionary sass
        working-directory: MyProject

      # حذف الملفات القديمة في build/ (Overwrite)
      - name: Clean Build Directory
        run: |
          rm -rf build/scss/*
          rm -rf build/css/*
        working-directory: MyProject

      # تشغيل Style Dictionary Build
      - name: Run Style Dictionary Build
        run: npx style-dictionary build
        working-directory: MyProject

      # تحويل SCSS لـ CSS باستخدام sass
      - name: Compile SCSS to CSS
        run: npx sass scss/style.scss build/css/style.css
        working-directory: MyProject

      # عمل Commit و Push للتغييرات
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'chore: Update generated SCSS and CSS files'
          file_pattern: 'MyProject/build/**/*'

      # تحضير الملفات للـ Deploy
      - name: Prepare Files for Deploy
        run: |
          mkdir -p public
          cp MyProject/index.html public/
          cp -r MyProject/build/css public/
          cp -r MyProject/imgs public/

      # رفع الملفات على GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public